# Allow H2 DB to be accessed via browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DB url and DB name (smp1) stored on your local disk
spring.datasource.url=jdbc:h2:file:~/h2/smp1
spring.datasource.username=sa
spring.datasource.password=

# Tells Hibernate to keep existing data and tables when the server restarts
spring.jpa.hibernate.ddl-auto=update

# This enables printing of SQL queries generated by Hibernate in your console
spring.jpa.show-sql=true

